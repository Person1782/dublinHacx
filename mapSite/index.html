<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NeedMap live community signal map." />
    <title>NeedMap Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">NeedMap dashboard</p>
        <h1>Community signals</h1>
      </div>
      <div class="status-wrap">
        <span id="live-dot" class="live-dot" aria-hidden="true"></span>
        <span id="status" role="status" aria-live="polite">Connecting…</span>
      </div>
    </header>

    <main>
      <div id="map" aria-label="Map of community reports"></div>
      <aside class="summary-card" aria-label="Map summary">
        <strong id="signal-count">0</strong>
        <span>signals shown</span>
      </aside>
    </main>

    <noscript>This map needs JavaScript to load Firebase reports.</noscript>

    <script type="module" src="./app.js"></script>
  </body>
</html>
